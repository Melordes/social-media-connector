[package]
name = "connector-core"
version = "0.1.2"
edition = "2024"
description = "Accounts, providers, storage and scheduling for Social Media Connector"
license = "Unlicense"
repository = "https://github.com/Melordes/social-media-connector"

[dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
keyring = "4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
url = "2"
regex = "1"
unicode-segmentation = "1"
thiserror = "2"
log = "0.4"
futures = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
